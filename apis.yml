aid: workist
name: Workist
description: >-
  Workist is a Berlin-based AI document-automation company whose WorKI system
  automates B2B order entry and inquiry handling — extracting data from emails
  and PDFs, validating it against ERP master data, and writing structured
  transactions back into 20+ ERP systems such as SAP S/4HANA, Microsoft
  Dynamics 365, Oracle NetSuite, and Sage. The Workist Integrations &
  Developer API is a bearer-token REST API for uploading documents (orders,
  invoices, delivery notes, order confirmations, RFQs, property bills, lists
  of services), retrieving processed results, and importing ERP master data in
  batches.
