components:
  schemas:
    Address:
      type: object
      properties:
        number:
          type: string
          nullable: true
        number2:
          type: string
          nullable: true
        number3:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        misc:
          type: string
          nullable: true
        company_name:
          type: string
          nullable: true
        company_name2:
          type: string
          nullable: true
        company_name3:
          type: string
          nullable: true
        company_name4:
          type: string
          nullable: true
        street_and_nr:
          type: string
          nullable: true
        street_name:
          type: string
          nullable: true
        street_number:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country_subdivision:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    AssignUserRequest:
      type: object
      properties:
        user:
          type: string
          minLength: 1
          description: Email address or id of a user.
      required:
      - user
    ChangeableMarkImportedRequest:
      type: object
      properties:
        status:
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          type: string
          default: SUCCEEDED
          description: |-
            Default is `SUCCEEDED`.

            * `PENDING` - Pending
            * `SUCCEEDED` - Succeeded
            * `FAILED` - Failed
        external_reference:
          type: string
          minLength: 1
          default: ''
          description: Id that represents this record in the target system
        external_status:
          type: string
          minLength: 1
          default: ''
          description: Status of the record in the target system
        external_message:
          type: string
          minLength: 1
          default: ''
          description: E.g. error message
    ContactPerson:
      type: object
      properties:
        number:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
    CreateDocumentRequest:
      type: object
      properties:
        channel:
          type: string
          format: uuid
          description: Id of a processing channel
        file:
          type: string
          format: binary
          description: File to be processed
        user:
          type: string
          minLength: 1
          description: Email address or id of a user.
      required:
      - channel
      - file
    Customer:
      type: object
      properties:
        number:
          type: string
          nullable: true
        number2:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        street_and_nr:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        customer_type:
          type: string
          nullable: true
        iln:
          type: string
          nullable: true
        contact_person:
          type: string
          nullable: true
    DeliveryNote:
      type: object
      properties:
        supplier:
          allOf:
          - $ref: '#/components/schemas/Customer'
          nullable: true
        buyer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          nullable: true
        delivery_address:
          allOf:
          - $ref: '#/components/schemas/Address'
          nullable: true
        delivery_date:
          type: string
          nullable: true
        delivery_note_date:
          type: string
          nullable: true
        order_date:
          type: string
          nullable: true
        delivery_note_number:
          type: string
          nullable: true
        order_number:
          type: string
          nullable: true
        info_text:
          type: string
          nullable: true
        commission_number:
          type: string
          nullable: true
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryNoteLineItem'
          nullable: true
    DeliveryNoteLineItem:
      type: object
      properties:
        pos:
          type: string
          nullable: true
        article_number:
          type: string
          nullable: true
        article_number_2:
          type: string
          nullable: true
        article_number_3:
          type: string
          nullable: true
        external_article_number:
          type: string
          nullable: true
        external_reference:
          type: string
          nullable: true
        discount_percentage:
          type: string
          nullable: true
        discount_amount:
