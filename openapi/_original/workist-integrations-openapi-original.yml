  /master-data/imports/{id}/data:
    post:
      operationId: imports_data_create
      description: Only for batched imports. Associates a batch of data (given as
        a `file`, `file_url` or JSON `data`) with the import. In case you are using
        the `file` or `file_url` parameters, each batch file needs to provide a similar
        header row containing the column names. To see the schema that the data should
        conform to, please refer to the import endpoint parameters for each type of
        master data. You can call this endpoint as often as needed to transfer all
        your data in batches, each batch will be appended to the import. When all
        data has been transferred, you need to start the import explicitly. Once the
        import has started processing, all data will be made available for download
        as a single CSV file (`input_file_url` and `input_file_num_rows` of the returned
        `DataImportRun`) - regardless of the format it was originally provided in.
        For a pretty overview of all imports and their status, you can check the master
        data imports in the Workbench (channel settings).
      summary: Append a batch of data to a batched import
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this data import run.
        required: true
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataRequest'
      responses:
        '202':
          headers:
            Location:
              schema:
                type: string
              description: URL to get the import status
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
          description: The data was successfully appended to the import. The status
            of the import can be checked by calling the import details endpoint with
            the returned import id.
        '400':
          description: The request was unacceptable, often due to missing a required
            parameter or an invalid value.
        '401':
          description: Unauthorized, no valid token provided.
        '404':
          description: The requested resource doesn't exist.
        '500':
          description: Something went wrong on Workist's end.
      security:
      - BearerAuthentication: []
  /master-data/imports/{id}/start:
    post:
      operationId: imports_start_create
      description: Only for batched imports. Starts the import and ingest all associated
        data. Note that you cannot POST any more batches of data to an import run
        once it has been started. If you have a single `file`, `file_url` or a small
        amount  of `data` that can be imported in a single request, prefer using a
        non-batched import instead.
      summary: Start the batched import & ingest all associated data
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this data import run.
        required: true
      tags:
      - Master Data
      responses:
        '202':
          headers:
            Location:
              schema:
                type: string
              description: URL to get the import status
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
          description: The import was started successfully
        '400':
          description: The request was unacceptable, often due to missing a required
            parameter or an invalid value.
        '401':
          description: Unauthorized, no valid token provided.
        '404':
          description: The requested resource doesn't exist.
        '500':
          description: Something went wrong on Workist's end.
