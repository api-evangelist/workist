openapi: 3.0.3
info:
  title: Workist Integrations & Developer API
  version: v1
  description: With this API you can access different resources of the Workist platform
    (e.g. processed documents, masterdata imports)
  termsOfService: https://www.workist.com/terms-of-use
  contact:
    email: info@workist.com
paths:
  /delivery-notes:
    get:
      operationId: delivery_notes_list
      description: 'To extract data from a file a `Processing Record` is created.
        Each `Processing Record` is part of a `Channel`. A `Channel` defines which
        fields should be extracted, confidence thresholds and more. '
      summary: Get all processing records for this document type
      parameters:
      - in: query
        name: channel
        schema:
          type: string
        description: Id of a processing channel
      - in: query
        name: assistance_needed
        schema:
          type: boolean
        description: Filter by assistance needed records
      - in: query
        name: finished
        schema:
          type: boolean
        description: Filter by finished records
      - in: query
        name: imported
        schema:
          type: boolean
        description: Filter records marked as [SUCCEEDED]
      - in: query
        name: import_failed
        schema:
          type: boolean
        description: Filter records marked as [FAILED]
      - in: query
        name: created_by
        schema:
          type: string
        description: Email address or id of a user.
      - in: query
        name: assisted_by
        schema:
          type: string
        description: Email address or id of a user.
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: 'Beginning of a date range (based on created_at) in ISO 8601
          format: `YYYY-MM-DDTHH:MM:SSZ`'
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
        description: 'End of a date range (based on created_at) in ISO 8601 format:
          `YYYY-MM-DDTHH:MM:SSZ`'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: show_unfinished_data
        schema:
          type: boolean
        description: |-
          By default, only completed data is displayed to avoid inaccuracies. However, you can use this parameter to access data still under processing.

          Default: `False`
      tags:
      - Delivery Notes
      security:
      - BearerAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeliveryNoteProcessingRecordList'
          description: ''
        '400':
          description: The request was unacceptable, often due to missing a required
            parameter or an invalid value.
        '401':
          description: Unauthorized, no valid token provided.
        '404':
          description: The requested resource doesn't exist.
        '500':
          description: Something went wrong on Workist's end.
    post:
      operationId: delivery_notes_create
      description: 'To extract data from a file a `Processing Record` is created.
        Each `Processing Record` is part of a `Channel`. A `Channel` defines which
        fields should be extracted, confidence thresholds and more. '
      summary: Add a new processing record for this document type
      parameters:
      - in: query
        name: show_unfinished_data
        schema:
          type: boolean
        description: |-
          By default, only completed data is displayed to avoid inaccuracies. However, you can use this parameter to access data still under processing.

          Default: `False`
      tags:
      - Delivery Notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      security:
      - BearerAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteProcessingRecord'
          description: ''
        '400':
          description: The request was unacceptable, often due to missing a required
            parameter or an invalid value.
        '401':
          description: Unauthorized, no valid token provided.
        '404':
          description: The requested resource doesn't exist.
        '500':
          description: Something went wrong on Workist's end.
