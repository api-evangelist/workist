        total_due:
          type: string
          nullable: true
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
          nullable: true
    Customer:
      type: object
      properties:
        number:
          type: string
          nullable: true
        number2:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        street_and_nr:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        customer_type:
          type: string
          nullable: true
        iln:
          type: string
          nullable: true
        contact_person:
          type: string
          nullable: true
  securitySchemes:
    BearerAuthentication:
      type: http
      scheme: bearer
externalDocs:
