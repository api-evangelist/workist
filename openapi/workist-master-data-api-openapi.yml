openapi: 3.2.0
info:
  title: Workist Integrations & Developer Master Data API
  version: v1
  description: With this API you can access different resources of the Workist platform (e.g. processed documents, masterdata imports)
  termsOfService: https://www.workist.com/terms-of-use
  contact:
    email: info@workist.com
servers:
- url: /v1/
- url: /api/v1/
tags:
- name: Master Data
paths:
  /master-data/addresses/imports:
    post:
      operationId: addresses_imports_create
      description: 'Create a new import for the given `lookup_definition_id`. To see the schema that the data should conform to, please refer to the import endpoint parameters for each type of master data.


        Note: by default, the given data will be imported immediately. If your data volume exceeds the limits for a single request (see `file`, `file_url` and `data` parameters below), you can create a batched import instead (by setting `batched: true`). Batched imports are created in pending status and will accept additional batches of data, which are appended to the import. After all batches of data have been transferred, batched imports need to be started explicitly.'
      summary: Create a new master data import
      tags:
      - Master Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressMasterDataImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressMasterDataImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressMasterDataImportRequest'
        required: true
      responses:
        '202':
          headers:
            Location:
              schema:
                type: string
              description: URL to get the import status
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
          description: The import run was created successfully. The status of the import can be checked by calling the import details endpoint with the returned import id.
        '400':
          description: The request was unacceptable, often due to missing a required parameter or an invalid value.
        '401':
          description: Unauthorized, no valid token provided.
        '404':
          description: The requested resource doesn't exist.
        '500':
          description: Something went wrong on Workist's end.
      security:
      - BearerAuthentication: []
