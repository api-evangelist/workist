  /master-data/imports:
    get:
      operationId: imports_list
      description: Returns all your master data import runs.
      summary: Get all master data import runs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
